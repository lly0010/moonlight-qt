---
name: Release
permissions:
  contents: write

# This fork cannot push tags directly, so releases are cut by pushing a change
# to .github/RELEASE_TRIGGER on the development branch (or via manual dispatch).
# The publish job creates the git tag and GitHub Release from within CI, where
# the workflow token has write access.
on:
  push:
    branches:
      - 'claude/moonlight-sunshine-custom-ports-k4jjlg'
    paths:
      - '.github/RELEASE_TRIGGER'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create'
        required: false
        default: 'v6.1.0-customports'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.vars.outputs.ci_version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Compute version and tag
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v6.1.0-customports"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ci_version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  publish:
    needs: [setup, build-appimage, build-steamlink, build-windows-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Package artifacts into release assets
        shell: bash
        run: |
          set -e
          mkdir -p release
          cd artifacts
          # Each user-facing artifact is a directory of files; zip each into a single
          # asset. Skip the debugging symbol artifacts (named zDevDbgSyms-*).
          for d in Moonlight-*/; do
            name="${d%/}"
            (cd "$d" && zip -r "$GITHUB_WORKSPACE/release/${name}.zip" .)
          done
          echo "Release assets:"
          ls -la "$GITHUB_WORKSPACE/release"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          set -e
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          This release adds support for **custom Sunshine ports** in the Moonlight
          client. In the "Add PC" dialog, enable **Use custom ports** to override the
          HTTPS, video, audio, control and RTSP ports independently (the HTTP port is
          set as `:port` on the host address). This is intended for hosts reachable on
          non-standard ports, e.g. behind NAT or port-forwarding that remaps each port.

          ### Downloads
          - **Windows x64 (portable):** `Moonlight-Windows-x64-*.zip`
          - **Windows ARM64 (portable):** `Moonlight-Windows-arm64-*.zip`
          - **macOS:** `Moonlight-macOS-*.zip` (contains the .dmg)
          - **Linux AppImage:** `Moonlight-LinuxAppImage-*.zip`
          - **Steam Link:** `Moonlight-SteamLink-*.zip`
          EOF

          # Recreate the release/tag so re-runs produce a clean result
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Moonlight $TAG (custom Sunshine ports)" \
            --notes-file "$NOTES_FILE" \
            "$GITHUB_WORKSPACE"/release/*.zip
